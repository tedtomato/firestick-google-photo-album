name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoFrame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoFrame-apk
          path: PhotoFrame.apk

      # Always-current download link: https://github.com/<you>/<repo>/releases/latest/download/PhotoFrame.apk
      # Only builds of the default branch are published; other branches just get the artifact above.
      - name: Publish as the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhotoFrame.apk \
            --target "${{ github.sha }}" \
            --title "Photo Frame build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest
